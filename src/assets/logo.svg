<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="isra-logo-title">
  <title id="isra-logo-title">ISRA Rendezvous Artfest</title>
  <style>
    /* Mirrors the project tokens in src/index.css :root */
    :root {
      --main-background: 40 114 161;
      --primary: 31 90 128;
      --accent: 232 132 92;
      --main-text: 234 244 250;
      --muted-text: 169 199 214;
    }
    .logo-bg      { fill: url(#isra-grad); }
    .logo-ring    { fill: none; stroke: rgba(255, 255, 255, 0.28); }
    .logo-ring-in { fill: none; stroke: rgba(255, 255, 255, 0.12); }
    .text-main    { fill: rgb(var(--main-text)); }
    .text-accent  { fill: rgb(var(--accent)); }
    .text-muted   { fill: rgb(var(--muted-text)); }
  </style>
  <defs>
    <linearGradient id="isra-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: rgb(var(--main-background))"/>
      <stop offset="1" style="stop-color: rgb(var(--primary))"/>
    </linearGradient>
  </defs>
  <rect class="logo-bg" x="2" y="2" width="96" height="96" rx="24"/>
  <rect class="logo-ring" x="2" y="2" width="96" height="96" rx="24" stroke-width="2"/>
  <rect class="logo-ring-in" x="11" y="11" width="78" height="78" rx="19" stroke-width="1.5"/>
  <text class="text-main" x="50" y="44" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="900" letter-spacing="1">ISRA</text>
  <text class="text-accent" x="50" y="60" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="7.2" font-weight="700" letter-spacing="2.4">RENDEZVOUS</text>
  <text class="text-muted" x="50" y="73" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="5.6" font-weight="600" letter-spacing="3">ARTFEST</text>
</svg>
