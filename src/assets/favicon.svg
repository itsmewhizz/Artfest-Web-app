<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="isra-favicon-title">
  <title id="isra-favicon-title">ISRA Rendezvous Artfest</title>
  <style>
    /* Mirrors the project tokens in src/index.css :root */
    :root {
      --main-background: 40 114 161;
      --primary: 31 90 128;
      --accent: 232 132 92;
      --main-text: 234 244 250;
      --muted-text: 169 199 214;
    }
    .fav-bg       { fill: url(#isra-fav-grad); }
    .fav-ring     { fill: none; stroke: rgba(255, 255, 255, 0.28); }
    .fav-ring-in  { fill: none; stroke: rgba(255, 255, 255, 0.12); }
    .fav-mark     { fill: rgb(var(--main-text)); }
    .fav-accent   { fill: rgb(var(--accent)); }
  </style>
  <defs>
    <linearGradient id="isra-fav-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: rgb(var(--main-background))"/>
      <stop offset="1" style="stop-color: rgb(var(--primary))"/>
    </linearGradient>
  </defs>
  <rect class="fav-bg" x="2" y="2" width="96" height="96" rx="24"/>
  <rect class="fav-ring" x="2" y="2" width="96" height="96" rx="24" stroke-width="2"/>
  <rect class="fav-ring-in" x="11" y="11" width="78" height="78" rx="19" stroke-width="1.5"/>
  <rect class="fav-mark" x="45" y="24" width="10" height="50" rx="5"/>
  <rect class="fav-mark" x="38" y="18" width="24" height="8" rx="4"/>
  <rect class="fav-mark" x="38" y="72" width="24" height="8" rx="4"/>
  <rect class="fav-accent" x="41" y="84" width="18" height="4.5" rx="2.25"/>
</svg>
